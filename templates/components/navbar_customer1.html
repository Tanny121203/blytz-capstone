{# Fixed navbar #}

{# Spacer — pushes content below the fixed navbar #}
<div class="h-[0px] sm:h-[0px]" aria-hidden="true"></div>

<!-- Mobile drawer -->
<div id="customer-nav-drawer" class="nav-drawer">
  <div class="nav-drawer-backdrop" data-nav-close></div>
  <div class="nav-drawer-panel bg-bg-surface" role="dialog" aria-label="Menu">
    <div class="mb-6 flex items-center justify-between px-4 py-4 border-b border-border">
      <span class="font-display text-lg text-text-primary">BLYTZ</span>
      <button type="button" class="inline-flex min-h-11 min-w-11 items-center justify-center text-text-primary" data-nav-close aria-label="Close">×</button>
    </div>
    <!-- Navigation links removed from mobile drawer -->
  </div>
</div>

<!-- Tiny Script to close the dropdown when clicking outside -->
<script>
  document.addEventListener('click', function(event) {
    const details = document.querySelectorAll('details');
    details.forEach((targetDetail) => {
      if (!targetDetail.contains(event.target)) {
        targetDetail.removeAttribute('open');
      }
    });
  });
</script>
