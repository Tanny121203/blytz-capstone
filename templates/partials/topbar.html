{# Blytz Staff Dashboard Top Bar #}
<header class="fixed top-0 left-60 right-0 h-16 bg-bg-page border-b border-border z-30 flex items-center justify-end px-6">
  
  {# Right side icons #}
  <div class="flex items-center gap-4">
    
    {# Notifications bell #}
    <div class="relative">
      <button class="relative p-2 text-text-muted hover:text-text-primary transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
        {% if pending_orders_count > 0 %}
        <span class="blytz-badge">{{ pending_orders_count }}</span>
        {% endif %}
      </button>
    </div>

    {# Messages/alerts #}
    <div class="relative">
      <button class="relative p-2 text-text-muted hover:text-text-primary transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
        </svg>
        {% if unread_messages_count > 0 %}
        <span class="blytz-badge">{{ unread_messages_count }}</span>
        {% endif %}
      </button>
    </div>

    {# Profile dropdown #}
    <div class="relative" x-data="{ open: false }">
      <button @click="open = !open" class="flex items-center gap-3 p-1 pr-2 rounded-lg hover:bg-bg-elevated transition-colors">
        <div class="w-8 h-8 rounded-full bg-accent flex items-center justify-center text-accent-text font-bold text-sm">
          {{ user.get_short_name|first|upper }}
        </div>
        <div class="text-left hidden sm:block">
          <p class="text-sm font-medium text-text-primary">{{ user.get_short_name }}</p>
          <p class="text-xs text-text-subtle">{{ user.email }}</p>
        </div>
        <svg class="w-4 h-4 text-text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>

      {# Dropdown menu (Alpine.js) #}
      <div x-show="open" @click.away="open = false" x-transition class="absolute right-0 mt-2 w-48 bg-bg-surface border border-border rounded-lg shadow-lg py-1 z-50">
        <a href="{% url 'account_profile' %}" class="block px-4 py-2 text-sm text-text-muted hover:bg-bg-elevated hover:text-text-primary transition-colors">
          Profile Overview
        </a>
        <a href="{% url 'account_logout' %}" class="block px-4 py-2 text-sm text-text-muted hover:bg-bg-elevated hover:text-text-primary transition-colors">
          Log out
        </a>
      </div>
    </div>

  </div>

</header>
